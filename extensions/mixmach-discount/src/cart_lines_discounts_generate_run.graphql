query CartInput($collectionIds: [ID!]) {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            eligible: inAnyCollection(ids: $collectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:mixmach-discount", key: "configuration") {
      value
    }
    progressBarMetafield: metafield(namespace: "$app:mixmach-progress", key: "configuration") {
      value
    }
  }
}
