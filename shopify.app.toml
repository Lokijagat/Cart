# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "52b94e12910a05b3d6f0937f6fdb3b6e"
name = "Mixmach"
application_url = "https://app.gbasket.in"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_discounts,write_app_proxy"

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "mixmach"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [webhooks.privacy_compliance]
  customer_data_request_url = "https://app.gbasket.in/webhooks/customers/data_request"
  customer_deletion_url = "https://app.gbasket.in/webhooks/customers/redact"
  shop_deletion_url = "https://app.gbasket.in/webhooks/shop/redact"

[auth]
redirect_urls = [ "https://app.gbasket.in/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
